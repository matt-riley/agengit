name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validation-linux:
    name: Validation (ubuntu-latest)
    permissions:
      contents: read
      packages: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@v2
    with:
      runner: ubuntu-latest
      lint: true
      test: true
      fmt: true
      concurrency-suffix: validation-linux

  validation-macos:
    name: Validation (macos-latest)
    permissions:
      contents: read
      packages: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@v2
    with:
      runner: macos-latest
      lint: true
      test: true
      concurrency-suffix: validation-macos

  sanitizers:
    name: Sanitizers
    permissions:
      contents: read
      packages: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@v2
    with:
      runner: ubuntu-latest
      test: true
      task-env: |
        TEST_SUITE=sanitizers
      concurrency-suffix: sanitizers

  fuzz:
    name: Fuzz hook payloads
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install configured tools
        run: mise install

      - name: Run bounded fuzz harnesses
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '30m' || '60s' }}
          CRASH_DIR: ${{ github.workspace }}/dist/crash-corpus
        run: mise run fuzz

      - name: Upload crash corpus
        if: github.event_name == 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-corpus
          path: dist/crash-corpus
          if-no-files-found: ignore

  store-roundtrip:
    name: Store roundtrip
    permissions:
      contents: read
      packages: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@v2
    with:
      runner: ubuntu-latest
      test: true
      task-env: |
        TEST_SUITE=store-roundtrip
      concurrency-suffix: store-roundtrip

  smoke-doctor:
    name: Smoke doctor
    permissions:
      contents: read
      packages: read
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@v2
    with:
      runner: ubuntu-latest
      test: true
      task-env: |
        TEST_SUITE=smoke-doctor
      concurrency-suffix: smoke-doctor

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: [validation-linux, validation-macos]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - aarch64-macos
          - x86_64-macos
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@v2
    with:
      runner: ubuntu-latest
      build: true
      task-env: |
        TARGET=${{ matrix.target }}
        OPTIMIZE=ReleaseSafe
      concurrency-suffix: cross-compile-${{ matrix.target }}

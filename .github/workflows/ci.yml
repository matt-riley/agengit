name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commit-messages:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commit subjects
        shell: bash
        run: |
          set -euo pipefail
          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}..HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.sha }}"
            fi
          fi

          bad=0
          while IFS=$'\t' read -r hash subject; do
            [ -z "${hash:-}" ] && continue
            if ! [[ "$subject" =~ $regex ]]; then
              echo "::error::${hash} has non-conventional subject: ${subject}"
              bad=1
            fi
          done < <(git --no-pager log --no-merges --format='%H%x09%s' "$range")

          if [ "$bad" -ne 0 ]; then
            echo "Conventional Commit check failed."
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: commit-messages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build and test
        run: zig build test

      - name: Run end-to-end tests
        run: zig build test-e2e

      - name: Check formatting
        run: zig build check-fmt

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - aarch64-macos
          - x86_64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

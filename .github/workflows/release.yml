name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Queue release runs so a newer push cannot cancel an in-flight publish
  # before the Homebrew tap update lands.
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@main
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl,  archive: agit-x86_64-linux.tar.gz,   binary: agit }
          - { target: aarch64-linux-musl, archive: agit-aarch64-linux.tar.gz,  binary: agit }
          - { target: aarch64-macos,      archive: agit-aarch64-macos.tar.gz,  binary: agit }
          - { target: x86_64-macos,       archive: agit-x86_64-macos.tar.gz,   binary: agit }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release binary
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.archive }} -C zig-out/bin ${{ matrix.binary }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fxq "$ARCHIVE"; then
            echo "Release asset ${ARCHIVE} already exists on ${TAG}; skipping upload."
            exit 0
          fi
          if ! gh release upload "$TAG" "dist/${ARCHIVE}" --repo "${{ github.repository }}"; then
            echo "::error::Failed to upload missing asset ${ARCHIVE}. If release ${TAG} is immutable, reruns cannot add missing assets; create a new release or remove immutability before retrying."
            exit 1
          fi

  checksums:
    name: Generate checksums
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download archives and generate checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "agit-*.tar.gz" \
            --dir dist
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fxq "checksums.txt"; then
            echo "Release asset checksums.txt already exists on ${TAG}; skipping upload."
            exit 0
          fi
          if ! gh release upload "$TAG" checksums.txt --repo "${{ github.repository }}"; then
            echo "::error::Failed to upload missing asset checksums.txt. If release ${TAG} is immutable, reruns cannot add missing assets; create a new release or remove immutability before retrying."
            exit 1
          fi

  publish:
    name: Publish release
    needs: [release-please, checksums]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false \
            --repo "${{ github.repository }}"

  homebrew:
    name: Update homebrew tap
    needs: [release-please, build, checksums, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Preflight homebrew tap access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.TAP_TOKEN }}
          TAP_REPO: matt-riley/homebrew-tools
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN secret not set — homebrew tap not updated. Add a PAT with contents:write to ${TAP_REPO} as HOMEBREW_TAP_GITHUB_TOKEN in this repo."
            exit 0
          fi

          print_sso_status() {
            echo "2. Checking SSO status..."
            if [ -n "${sso_header:-}" ]; then
              echo "::warning::GitHub SSO header returned: ${sso_header}. If SSO is required, authorize the token for the organization."
            else
              echo "No GitHub SSO challenge header returned."
            fi
          }

          print_token_expiration() {
            echo "4. Checking token expiry..."
            if [ -n "${token_expiration:-}" ]; then
              echo "Token expiration reported by GitHub: ${token_expiration}"
            else
              echo "GitHub did not return a token-expiration header for this token type."
            fi
          }

          echo "1. Checking token scope/repo access for ${TAP_REPO}..."
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --write-out 'HTTP_STATUS:%{http_code}' \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TAP_REPO}")"
          http_status="${headers##*HTTP_STATUS:}"
          header_block="${headers%HTTP_STATUS:*}"
          oauth_scopes="$(printf '%s\n' "$header_block" | awk 'BEGIN { IGNORECASE=1 } /^x-oauth-scopes:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"
          accepted_scopes="$(printf '%s\n' "$header_block" | awk 'BEGIN { IGNORECASE=1 } /^x-accepted-oauth-scopes:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"
          sso_header="$(printf '%s\n' "$header_block" | awk 'BEGIN { IGNORECASE=1 } /^x-github-sso:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"
          token_expiration="$(printf '%s\n' "$header_block" | awk 'BEGIN { IGNORECASE=1 } /^github-authentication-token-expiration:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"

          echo "GitHub repo API status: ${http_status}"
          echo "Token scopes reported by GitHub: ${oauth_scopes:-<not reported for this token type>}"
          echo "Accepted scopes for repo endpoint: ${accepted_scopes:-<none reported>}"
          if [ "$http_status" != "200" ]; then
            echo "::error::Token cannot read ${TAP_REPO} (HTTP ${http_status}). Confirm the token has repo access and Contents read/write permission; this workflow cannot grant missing permission."
            print_sso_status
            echo "3. Checking branch protection..."
            echo "Skipped because the token could not read ${TAP_REPO}."
            print_token_expiration
            exit 1
          fi

          can_push="$(GH_TOKEN="${TAP_TOKEN}" gh api "repos/${TAP_REPO}" --jq '(.permissions.push // false)')"
          default_branch="$(GH_TOKEN="${TAP_TOKEN}" gh api "repos/${TAP_REPO}" --jq '.default_branch')"
          if [ "$can_push" != "true" ]; then
            echo "::error::Token can read ${TAP_REPO} but does not have push permission. Use a token whose actor can push to ${TAP_REPO} with Contents read/write; this workflow cannot grant missing permission."
            push_allowed=false
          else
            echo "Token has push permission on ${TAP_REPO}."
            push_allowed=true
          fi

          print_sso_status

          echo "3. Checking branch protection for ${TAP_REPO}@${default_branch}..."
          if protection_summary="$(GH_TOKEN="${TAP_TOKEN}" gh api "repos/${TAP_REPO}/branches/${default_branch}/protection" --jq '{required_status_checks: (.required_status_checks != null), required_pull_request_reviews: (.required_pull_request_reviews != null), restrictions: (.restrictions != null), enforce_admins: (.enforce_admins.enabled // false)}' 2>&1)"; then
            echo "::notice::Default branch protection is enabled: ${protection_summary}"
            echo "::notice::If git push later returns 403, confirm this token actor is allowed to push or bypass branch protection."
          elif printf '%s' "$protection_summary" | grep -q "HTTP 404"; then
            echo "No branch protection reported for ${default_branch}."
          else
            echo "::warning::Could not inspect branch protection: ${protection_summary}"
          fi

          print_token_expiration

          if [ "$push_allowed" != "true" ]; then
            exit 1
          fi

      - name: Generate and push formula
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN secret not set — homebrew tap not updated. Add a PAT with contents:write to matt-riley/homebrew-tools as HOMEBREW_TAP_GITHUB_TOKEN in this repo."
            exit 0
          fi
          VERSION="${TAG#v}"
          dist_dir="${PWD}/dist/homebrew-assets"
          tap_dir="${PWD}/dist/homebrew-tools"
          rm -rf "$dist_dir" "$tap_dir"
          mkdir -p "$dist_dir"
          for ARCH_OS in x86_64-macos aarch64-macos x86_64-linux aarch64-linux; do
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern "agit-${ARCH_OS}.tar.gz" --dir "$dist_dir"
          done
          SHA_X86_MACOS=$(sha256sum "$dist_dir/agit-x86_64-macos.tar.gz"  | awk '{print $1}')
          SHA_ARM_MACOS=$(sha256sum "$dist_dir/agit-aarch64-macos.tar.gz" | awk '{print $1}')
          SHA_X86_LINUX=$(sha256sum "$dist_dir/agit-x86_64-linux.tar.gz"  | awk '{print $1}')
          SHA_ARM_LINUX=$(sha256sum "$dist_dir/agit-aarch64-linux.tar.gz" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/matt-riley/homebrew-tools.git" \
            "$tap_dir"
          cat > "$tap_dir/Formula/agit.rb" << FORMULA
          # typed: false
          # frozen_string_literal: true

          # Managed by CI — do not edit manually.
          class Agit < Formula
            desc "AI-agent version control"
            homepage "https://github.com/matt-riley/agengit"
            version "${VERSION}"
            license "GPL-3.0-only"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/matt-riley/agengit/releases/download/${TAG}/agit-aarch64-macos.tar.gz"
                sha256 "${SHA_ARM_MACOS}"
              else
                url "https://github.com/matt-riley/agengit/releases/download/${TAG}/agit-x86_64-macos.tar.gz"
                sha256 "${SHA_X86_MACOS}"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/matt-riley/agengit/releases/download/${TAG}/agit-aarch64-linux.tar.gz"
                sha256 "${SHA_ARM_LINUX}"
              else
                url "https://github.com/matt-riley/agengit/releases/download/${TAG}/agit-x86_64-linux.tar.gz"
                sha256 "${SHA_X86_LINUX}"
              end
            end

            def install
              bin.install "agit"
            end

            test do
              system bin/"agit", "version"
            end
          end
          FORMULA
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agit.rb
          git diff --staged --quiet || git commit -m "chore: update agit to ${VERSION}"
          git push

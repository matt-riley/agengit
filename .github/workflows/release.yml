name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-release-commit:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      is_release_commit: ${{ steps.detect.outputs.is_release_commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - id: detect
        run: |
          set -euo pipefail
          subject="$(git show -s --format=%s HEAD)"
          if [[ "$subject" =~ ^chore\(main\):\ release\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
            echo "is_release_commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_release_commit=false" >> "$GITHUB_OUTPUT"

  release-please:
    needs: detect-release-commit
    if: needs.detect-release-commit.outputs.is_release_commit != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true
